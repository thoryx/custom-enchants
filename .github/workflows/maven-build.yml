name: Build and upload single JAR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Maven
        run: mvn -DskipTests package

      - name: Rename JAR for artifact
        run: |
          JAR=$(ls target/*.jar | head -n1)
          mv "$JAR" target/custom-enchants.jar

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: custom-enchants-jar
          path: target/custom-enchants.jar
